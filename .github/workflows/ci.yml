name: Proteus CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-validation:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Generate Reference Deployment Artifacts
      run: |
        PYTHONPATH=. python scripts/export_deployment_artifact.py

    - name: Run Core Test Suite (PyTest)
      run: |
        PYTHONPATH=. pytest tests/ -v

    - name: Run SDN Controller Unit Tests
      run: |
        PYTHONPATH=. python -m unittest discover -s sdn/topology -p "test_*.py" -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Next.js Application
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: npm run build
